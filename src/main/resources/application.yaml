spring:
  application:
    name: mssql-flink-replication-service

  datasource:
    url: jdbc:postgresql://localhost:5432/target_db?currentSchema=oracle_metadata
    username: postgres
    password: kampus
    hikari:
      maximum-pool-size: 20
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      pool-name: TargetDBPool

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,info
    endpoint:
      health:
        show-details: always
    metrics:
      export:
        prometheus:
          enabled: true

replication:
  enabled: true
  max-retries: 5

