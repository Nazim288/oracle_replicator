  oracle:
    tables:
      - all_col_comments
      - all_mviews
      - all_tab_cols
      - all_tab_comments
      - ALL_TAB_IDENTITY_COLS
      - all_tables
      - all_views

    target-database-property:
      url: jdbc:postgresql://localhost:5432/target_db?currentSchema=oracle_metadata
      username: postgres
      password: kampus

flink:
  job:
    name: pg-replication-job
    parallelism: 1
    max-retries: 3
    retry-delay-ms: 1000
    cron: "0 0 22 * * *"

    checkpoint:
      interval: 60000 # ???????? ????? ????????? (??)
      timeout: 30000
      mode: EXACTLY_ONCE
    restart-strategy:
      fixed-delay:
        attempts: 3
        delay: 10000
    buffer-timeout: 100
    watermark-interval: 10000

logging:
  level:
    root: INFO
    org:
      apache:
        flink: INFO
      springframework:
        jdbc: WARN
      hikari: WARN
    com:
      example:
        flinkreplication: DEBUG
  file:
    name: logs/flink-replication.log
    max-size: 50MB
    max-history: 7
  pattern:
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    console: "%d{HH:mm:ss} %-5level %logger{36} - %msg%n"