services:
  oracle-db:
    platform: linux/amd64
    image: gvenzl/oracle-xe:21-slim
    container_name: oracle-db
    ports:
      - "1521:1521"
    environment:
      ORACLE_PASSWORD: oracle_password
      APP_USER: oracle_user
      APP_USER_PASSWORD: oracle_password
    volumes:
      - oracle_data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "bash", "-c", "echo 'SELECT 1 FROM DUAL;' | sqlplus -s oracle_user/oracle_password@localhost/XEPDB1"]
      interval: 20s
      timeout: 10s
      retries: 10

volumes:
  oracle_data:
